const TAB_ON  = "tab-btn flex-1 py-3 px-4 rounded-xl font-bold text-sm transition text-center shadow-sm bg-cyan-600 text-white min-w-[130px]";
const TAB_OFF = "tab-btn flex-1 py-3 px-4 rounded-xl font-bold text-sm transition text-center bg-slate-100 dark:bg-slate-700/60 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 min-w-[130px]";
const OPT_BASE = "w-full text-left p-4 rounded-xl border bg-slate-50/50 dark:bg-slate-800/50 transition font-medium text-slate-800 dark:text-slate-200 flex items-center gap-3 ";
const LETTERS = ["A. ", "B. ", "C. ", "D. "];

let p1Questions = [], p1Index = 0, p1Score = 0, p1Locked = false;
let p2Questions = [], p2Index = 0, p2Score = 0, p2Answers = {};

function toggleDarkMode() {
  const isDark = document.documentElement.classList.toggle('dark');
  document.getElementById('theme-icon').textContent = isDark ? '☀️' : '🌙';
  document.getElementById('theme-text').textContent = isDark ? 'Giao diện sáng' : 'Giao diện tối';
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const show = (id, on) => document.getElementById(id).style.display = on ? 'block' : 'none';

function switchTab(n) {
  [1, 2].forEach(i => document.getElementById('tab-p' + i).className = i === n ? TAB_ON : TAB_OFF);
  show('p1-screen', n === 1 && p1Index < p1Questions.length);
  show('p1-result', n === 1 && p1Index >= p1Questions.length);
  show('p2-screen', n === 2 && p2Index < p2Questions.length);
  show('p2-result', n === 2 && p2Index >= p2Questions.length);
}

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.remove('hidden');
}

/* ---------- PHẦN I ---------- */
function startP1Quiz() {
  p1Questions = shuffle(p1RawData).map(q => {
    const opts = q.options.map((text, idx) => ({ text, isCorrect: idx === q.answer }));
    return { qText: q.q, options: q.keepOrder ? opts : shuffle(opts), images: q.images || null };
  });
  p1Index = 0; p1Score = 0;
  updateP1Score();
  showP1Question();
  switchTab(1);
}

function updateP1Score() {
  document.getElementById('p1-score').textContent = `Điểm: ${p1Score}/${p1Questions.length}`;
}

function showP1Question() {
  const q = p1Questions[p1Index];
  p1Locked = false;
  document.getElementById('p1-progress').textContent = `Câu ${p1Index + 1} / ${p1Questions.length}`;
  document.getElementById('p1-question').textContent = `Câu ${p1Index + 1}. ${q.qText}`;

  // Hình minh hoạ (nếu có)
  const imgBox = document.getElementById('p1-image-container');
  const grid = document.getElementById('p1-image-grid');
  grid.innerHTML = '';
  if (q.images) {
    q.images.forEach(name => {
      const card = document.createElement('div');
      card.className = "text-center p-2 bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700";
      const img = document.createElement('img');
      img.src = FIG[name]; img.alt = name;
      img.className = "rounded-lg mx-auto max-h-56 object-contain cursor-zoom-in";
      img.onclick = () => openLightbox(FIG[name]);
      const cap = document.createElement('span');
      cap.className = "block text-sm font-bold text-cyan-600 dark:text-cyan-400 mt-2";
      cap.textContent = name;
      card.append(img, cap);
      grid.appendChild(card);
    });
    imgBox.classList.remove('hidden');
  } else {
    imgBox.classList.add('hidden');
  }

  // Đáp án — dùng textContent để thẻ HTML như <p>, <body>, <meta>... hiển thị đúng dạng chữ
  const container = document.getElementById('p1-options');
  container.innerHTML = '';
  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = OPT_BASE + "border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700";
    const letter = document.createElement('span');
    letter.className = "font-bold text-cyan-600 dark:text-cyan-400 shrink-0";
    letter.textContent = LETTERS[idx];
    const text = document.createElement('span');
    text.textContent = opt.text;
    btn.append(letter, text);
    btn.onclick = () => selectP1Option(btn, opt.isCorrect);
    container.appendChild(btn);
  });
  document.getElementById('p1-next-btn').disabled = true;
}

function selectP1Option(selectedBtn, isCorrect) {
  if (p1Locked) return;
  p1Locked = true;
  const q = p1Questions[p1Index];
  document.getElementById('p1-options').querySelectorAll('button').forEach((btn, idx) => {
    btn.disabled = true;
    if (q.options[idx].isCorrect) {
      btn.className = OPT_BASE + "border-2 border-emerald-500 !bg-emerald-50 dark:!bg-emerald-950/60 !text-emerald-800 dark:!text-emerald-200 font-bold";
    }
  });
  if (isCorrect) {
    p1Score++;
    updateP1Score();
  } else {
    selectedBtn.className = OPT_BASE + "border-2 border-rose-500 !bg-rose-50 dark:!bg-rose-950/60 !text-rose-800 dark:!text-rose-200 font-bold";
  }
  document.getElementById('p1-next-btn').disabled = false;
}

function nextP1Question() {
  p1Index++;
  if (p1Index < p1Questions.length) {
    showP1Question();
  } else {
    document.getElementById('p1-final-score').textContent = `${p1Score} / ${p1Questions.length}`;
    document.getElementById('p1-result-msg').textContent =
      p1Score >= 40 ? "Rất xuất sắc! Bạn đã vượt qua phần trắc nghiệm." : "Hãy cố gắng ôn tập kỹ hơn!";
    switchTab(1);
  }
}

/* ---------- PHẦN II ---------- */
function p2Total() { return p2Questions.reduce((s, q) => s + q.items.length, 0); }

function startP2Quiz() {
  p2Questions = shuffle(p2RawData);
  p2Index = 0; p2Score = 0;
  updateP2Score();
  showP2Question();
  switchTab(2);
}

function updateP2Score() {
  document.getElementById('p2-score').textContent = `Điểm: ${p2Score}/${p2Total()} ý`;
}

const ITEM_BASE = "p-4 rounded-xl flex flex-col md:flex-row md:items-center justify-between gap-4 ";
const CHOICE_OFF = "px-4 py-2 rounded-lg border border-slate-200 dark:border-slate-600 font-bold text-xs hover:bg-cyan-50 dark:hover:bg-cyan-950/60 transition";

function showP2Question() {
  p2Answers = {};
  const q = p2Questions[p2Index];
  document.getElementById('p2-progress').textContent = `Bài ${p2Index + 1} / ${p2Questions.length}`;
  document.getElementById('p2-title').textContent = q.title;

  const container = document.getElementById('p2-items');
  container.innerHTML = '';
  q.items.forEach((item, idx) => {
    const div = document.createElement('div');
    div.id = `p2-item-${idx}`;
    div.className = ITEM_BASE + "border border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800/50";
    div.innerHTML = `
      <div class="font-medium text-slate-800 dark:text-slate-200 text-sm leading-relaxed"></div>
      <div class="flex gap-2 shrink-0">
        <button id="btn-t-${idx}" onclick="selectP2Choice(${idx}, true)" class="${CHOICE_OFF}">ĐÚNG</button>
        <button id="btn-f-${idx}" onclick="selectP2Choice(${idx}, false)" class="${CHOICE_OFF}">SAI</button>
      </div>`;
    div.firstElementChild.textContent = item.text;
    container.appendChild(div);
  });

  const check = document.getElementById('p2-check-btn');
  check.style.display = 'inline-block';
  check.disabled = true;
  document.getElementById('p2-next-btn').style.display = 'none';
}

function selectP2Choice(idx, val) {
  p2Answers[idx] = val;
  const t = document.getElementById(`btn-t-${idx}`), f = document.getElementById(`btn-f-${idx}`);
  const ON = "px-4 py-2 rounded-lg text-white font-bold text-xs transition shadow-sm ";
  t.className = val ? ON + "bg-cyan-600" : CHOICE_OFF;
  f.className = val ? CHOICE_OFF : ON + "bg-slate-700";
  if (Object.keys(p2Answers).length === p2Questions[p2Index].items.length) {
    document.getElementById('p2-check-btn').disabled = false;
  }
}

function checkP2Answer() {
  const q = p2Questions[p2Index];
  q.items.forEach((item, idx) => {
    const ok = p2Answers[idx] === item.answer;
    if (ok) p2Score++;
    document.getElementById(`p2-item-${idx}`).className = ITEM_BASE +
      (ok ? "border-2 border-emerald-500 bg-emerald-50/50 dark:bg-emerald-950/40"
          : "border-2 border-rose-500 bg-rose-50/50 dark:bg-rose-950/40");
    const t = document.getElementById(`btn-t-${idx}`), f = document.getElementById(`btn-f-${idx}`);
    t.disabled = f.disabled = true;
    (item.answer ? t : f).className = "px-4 py-2 rounded-lg bg-emerald-600 text-white font-bold text-xs shadow-sm";
  });
  updateP2Score();
  document.getElementById('p2-check-btn').style.display = 'none';
  document.getElementById('p2-next-btn').style.display = 'inline-block';
}

function nextP2Question() {
  p2Index++;
  if (p2Index < p2Questions.length) {
    showP2Question();
  } else {
    document.getElementById('p2-final-score').textContent = `${p2Score} / ${p2Total()} ý`;
    document.getElementById('p2-result-msg').textContent =
      p2Score >= 20 ? "Rất tốt! Bạn nắm chắc phần Đúng / Sai." : "Hãy xem lại các ý còn sai và thử lại nhé!";
    switchTab(2);
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('lightbox').classList.add('hidden'); });

startP1Quiz();
startP2Quiz();
switchTab(1);
</script>
</body>
</html>
